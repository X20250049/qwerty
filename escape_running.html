<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b8b4c8">
  <title>Hamster Run · Hamster Care</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <style>
    :root {
      color-scheme: light;
      --page: #b8b4c8;
      --panel: #a9bfcb;
      --highlight: #d8d8d8;
      --ink: #332d2a;
      --muted: #5b5658;
      --track: rgba(255, 255, 255, 0.55);
      --accent: #e99b55;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1.25rem;
      background: var(--page);
      color: var(--ink);
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(100%, 58rem);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      padding: 0.65rem 1rem;
      border-radius: 999px;
      color: var(--ink);
      text-decoration: none;
    }

    .back-link:hover,
    .back-link:focus-visible {
      background: var(--highlight);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
    }

    .subtitle {
      margin: 0.45rem 0 1.5rem;
      color: var(--muted);
    }

    .game-card {
      overflow: hidden;
      border-radius: 1.25rem;
      background: var(--panel);
      box-shadow: 0 0.5rem 1.5rem rgba(51, 45, 42, 0.08);
    }

    .hud {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
      padding: 1rem 1.25rem;
      background: rgba(255, 255, 255, 0.2);
    }

    .stat {
      min-width: 0;
      padding: 0.8rem 1rem;
      border-radius: 0.9rem;
      background: rgba(255, 255, 255, 0.42);
    }

    .stat-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.45rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .stat-value {
      color: var(--ink);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .energy-track {
      height: 0.65rem;
      overflow: hidden;
      border-radius: 999px;
      background: var(--track);
    }

    .energy-fill {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      background: #87a982;
      transition: width 120ms linear, background-color 180ms ease;
    }

    .energy-fill.low {
      background: #df8b68;
    }

    .play-area {
      position: relative;
      display: grid;
      min-height: 29rem;
      overflow: hidden;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(ellipse at 50% 100%, rgba(255, 255, 255, 0.35), transparent 56%),
        #c8d4cc;
      touch-action: none;
      user-select: none;
    }

    .play-area::before {
      position: absolute;
      right: -8%;
      bottom: -5rem;
      left: -8%;
      height: 9rem;
      border-radius: 50%;
      background: rgba(125, 148, 123, 0.2);
      content: "";
    }

    .wheel {
      position: relative;
      display: grid;
      width: min(68vw, 23rem);
      aspect-ratio: 1;
      place-items: center;
      border: 1.3rem solid #8b7770;
      border-radius: 50%;
      background: rgba(247, 239, 219, 0.48);
      box-shadow:
        0 1.1rem 0 #6e615e,
        0 1.6rem 1.6rem rgba(51, 45, 42, 0.2),
        inset 0 0 0 0.35rem rgba(255, 255, 255, 0.62);
    }

    .wheel-turn {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
    }

    .wheel-turn::before {
      position: absolute;
      inset: 0.4rem;
      border: 0.25rem dashed rgba(255, 255, 255, 0.78);
      border-radius: 50%;
      content: "";
    }

    .spokes {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: repeating-conic-gradient(
        from 0deg,
        transparent 0deg 43deg,
        rgba(139, 119, 112, 0.55) 44deg 46deg,
        transparent 47deg 90deg
      );
      mask: radial-gradient(circle, transparent 0 1.4rem, #000 1.45rem 100%);
      -webkit-mask: radial-gradient(circle, transparent 0 1.4rem, #000 1.45rem 100%);
    }

    .hamster {
      z-index: 2;
      width: 58%;
      height: 58%;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0.4rem 1rem rgba(51, 45, 42, 0.18);
      cursor: pointer;
    }

    .wheel.running .hamster {
      animation: hamster-run 500ms ease-in-out infinite alternate;
    }

    .wheel.boosted .hamster {
      animation-duration: 180ms;
    }

    @keyframes hamster-run {
      from { transform: translateY(0) rotate(-2deg); }
      to { transform: translateY(-0.45rem) rotate(2deg); }
    }

    .ground-shadow {
      position: absolute;
      bottom: 2.3rem;
      width: min(58vw, 19rem);
      height: 1.2rem;
      border-radius: 50%;
      background: rgba(51, 45, 42, 0.17);
      filter: blur(0.35rem);
    }

    .seed {
      position: absolute;
      z-index: 4;
      display: grid;
      width: 3.5rem;
      height: 3.5rem;
      place-items: center;
      border: 0.2rem solid #f8e4a9;
      border-radius: 50%;
      background: #f4c76d;
      box-shadow: 0 0.25rem 0.7rem rgba(51, 45, 42, 0.2);
      color: #765b3c;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      animation: seed-float 1.5s ease-in-out infinite alternate;
    }

    .seed:hover,
    .seed:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 2px;
    }

    @keyframes seed-float {
      to { transform: translateY(-0.65rem) rotate(12deg); }
    }

    .game-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem 1.25rem 1.25rem;
    }

    .message {
      min-height: 1.5rem;
      margin: 0;
      color: var(--muted);
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    .game-button {
      min-height: 2.8rem;
      padding: 0.65rem 1.1rem;
      border: 0;
      border-radius: 999px;
      background: var(--highlight);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: transform 160ms ease, filter 160ms ease;
    }

    .game-button:hover {
      filter: brightness(1.04);
      transform: translateY(-2px);
    }

    .game-button:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    .game-button.primary {
      background: var(--accent);
    }

    .game-button.stop {
      background: #d96b63;
      color: #fff;
    }

    .game-button[hidden] {
      display: none;
    }

    .victory-card {
      display: grid;
      min-height: 22rem;
      align-content: center;
      justify-items: center;
      gap: 1rem;
      padding: 2rem;
      border-radius: 1.25rem;
      background: var(--panel);
      box-shadow: 0 0.5rem 1.5rem rgba(51, 45, 42, 0.08);
      text-align: center;
    }

    .victory-card[hidden] {
      display: none;
    }

    .victory-card h2 {
      margin: 0;
      font-size: clamp(2.5rem, 10vw, 4.5rem);
    }

    .victory-card p {
      margin: 0;
      color: var(--muted);
    }

    .victory-card .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 2.8rem;
      padding: 0.65rem 1.1rem;
      border-radius: 999px;
      background: var(--highlight);
      color: var(--ink);
      text-decoration: none;
    }

    .victory-card .back-link:hover,
    .victory-card .back-link:focus-visible {
      filter: brightness(1.04);
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    @media (max-width: 42rem) {
      body {
        padding: 1.25rem 1rem;
      }

      .hud {
        gap: 0.45rem;
        padding: 0.75rem;
      }

      .stat {
        padding: 0.7rem 0.65rem;
      }

      .stat-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 0.2rem;
        font-size: 0.8rem;
      }

      .play-area {
        min-height: 24rem;
      }

      .wheel {
        width: min(78vw, 20rem);
        border-width: 1rem;
      }

      .game-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="back-link" href="index.html">← Back to Home</a>
      <span>Hamster Exercise Time</span>
    </header>

    <h1>Hamster Run</h1>
    <p class="subtitle">Dango jogs at a steady pace. Click or hold Dango to run faster, and collect seeds to restore energy!</p>

    <section class="game-card" aria-label="Hamster wheel game">
      <div class="hud">
        <div class="stat">
          <div class="stat-heading"><span>Score</span><span class="stat-value" id="score">0</span></div>
        </div>
        <div class="stat">
          <div class="stat-heading"><span>Laps</span><span class="stat-value" id="laps">0</span></div>
        </div>
        <div class="stat">
          <div class="stat-heading">
            <span>Energy</span>
            <span class="stat-value"><span id="energy-value">100</span>%</span>
          </div>
          <div class="energy-track" role="progressbar" aria-label="Energy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100" id="energy-track">
            <div class="energy-fill" id="energy-fill"></div>
          </div>
        </div>
      </div>

      <div class="play-area" id="play-area">
        <div class="ground-shadow" aria-hidden="true"></div>
        <div class="wheel" id="wheel" aria-label="Running wheel">
          <div class="wheel-turn" id="wheel-turn" aria-hidden="true">
            <div class="spokes"></div>
          </div>
          <img class="hamster" src="run.jpg" alt="Dango running">
        </div>
      </div>

      <div class="game-footer">
        <p class="message" id="message" aria-live="polite">Select Start Game to begin Dango's jog.</p>
        <div class="buttons">
          <button class="game-button primary" id="start-button" type="button">Start Game</button>
          <button class="game-button stop" id="stop-button" type="button" hidden>Stop</button>
          <button class="game-button" id="restart-button" type="button">Restart</button>
        </div>
      </div>
    </section>

    <section class="victory-card" id="victory-card" aria-labelledby="victory-title" hidden>
      <h2 id="victory-title">VICTORY</h2>
      <p>Dango completed 10 laps!</p>
      <a class="back-link" href="index.html">← Back to Home</a>
    </section>
  </main>

  <script>
    const playArea = document.getElementById("play-area");
    const wheel = document.getElementById("wheel");
    const wheelTurn = document.getElementById("wheel-turn");
    const startButton = document.getElementById("start-button");
    const stopButton = document.getElementById("stop-button");
    const restartButton = document.getElementById("restart-button");
    const message = document.getElementById("message");
    const scoreDisplay = document.getElementById("score");
    const lapsDisplay = document.getElementById("laps");
    const energyDisplay = document.getElementById("energy-value");
    const energyTrack = document.getElementById("energy-track");
    const energyFill = document.getElementById("energy-fill");

    let score = 0;
    let laps = 0;
    let energy = 100;
    let angle = 0;
    let running = false;
    let gameStarted = false;
    let gameWon = false;
    let lastFrame = performance.now();
    let seedTimeout;
    let audioContext;

    function ensureAudioContext() {
      if (!audioContext) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtor) return null;
        audioContext = new AudioCtor();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume();
      }
      return audioContext;
    }

    function playTapSound() {
      const context = ensureAudioContext();
      if (!context) return;

      const oscillator = context.createOscillator();
      const gainNode = context.createGain();
      oscillator.type = "triangle";
      oscillator.frequency.setValueAtTime(520, context.currentTime);
      oscillator.frequency.exponentialRampToValueAtTime(260, context.currentTime + 0.1);

      gainNode.gain.setValueAtTime(0.0001, context.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(0.12, context.currentTime + 0.01);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + 0.12);

      oscillator.connect(gainNode);
      gainNode.connect(context.destination);
      oscillator.start();
      oscillator.stop(context.currentTime + 0.13);
    }

    function updateEnergy() {
      const roundedEnergy = Math.round(energy);
      energyDisplay.textContent = String(roundedEnergy);
      energyFill.style.width = `${energy}%`;
      energyFill.classList.toggle("low", energy <= 25);
      energyTrack.setAttribute("aria-valuenow", String(roundedEnergy));
    }

    function addScore(amount) {
      score += amount;
      scoreDisplay.textContent = String(score);
    }

    function clearSeeds() {
      window.clearTimeout(seedTimeout);
      playArea.querySelectorAll(".seed").forEach((seed) => seed.remove());
    }

    function scheduleSeed(delay) {
      window.clearTimeout(seedTimeout);
      if (delay === undefined) {
        delay = running ? 200 + Math.random() * 300 : 900 + Math.random() * 600;
      }
      seedTimeout = window.setTimeout(spawnSeed, delay);
    }

    function spawnSeed() {
      if (!gameStarted) return;

      const seed = document.createElement("button");
      seed.className = "seed";
      seed.type = "button";
      seed.textContent = "Seed";
      seed.setAttribute("aria-label", "Collect a seed to restore 5 energy");
      const maxX = Math.max(8, playArea.clientWidth - 64);
      const maxY = Math.max(8, playArea.clientHeight - 64);
      seed.style.left = `${8 + Math.random() * (maxX - 8)}px`;
      seed.style.top = `${8 + Math.random() * (maxY - 8)}px`;
      seed.addEventListener("pointerdown", (event) => event.stopPropagation());
      seed.addEventListener("click", (event) => {
        event.stopPropagation();
        energy = Math.min(100, energy + 5);
        updateEnergy();
        playTapSound();
        seed.remove();
        message.textContent = "Seed collected! Dango restored 5 energy.";
      }, { once: true });
      playArea.append(seed);
      window.setTimeout(() => seed.remove(), 5500);
      scheduleSeed();
    }

    function startGame() {
      if (gameStarted || gameWon) return;
      gameStarted = true;
      startButton.hidden = true;
      stopButton.hidden = false;
      wheel.classList.add("running");
      message.textContent = "Dango is jogging steadily. Click or hold Dango to speed up!";
      scheduleSeed(500);
    }

    function stopGame() {
      gameStarted = false;
      running = false;
      wheel.classList.remove("running", "boosted");
      startButton.hidden = false;
      stopButton.hidden = true;
      clearSeeds();
      message.textContent = "Game stopped. Start again or restart to play.";
    }

    function restartGame() {
      gameWon = false;
      running = false;
      gameStarted = true;
      score = 0;
      laps = 0;
      energy = 100;
      angle = 0;
      wheelTurn.style.transform = "rotate(0deg)";
      scoreDisplay.textContent = "0";
      lapsDisplay.textContent = "0";
      updateEnergy();
      clearSeeds();
      startButton.hidden = true;
      stopButton.hidden = false;
      document.getElementById("victory-card").hidden = true;
      document.querySelector(".game-card").hidden = false;
      wheel.classList.add("running");
      message.textContent = "Dango is jogging steadily. Click or hold Dango to speed up!";
      scheduleSeed(500);
    }

    function beginRunning(event) {
      if (!gameStarted || energy <= 0 || !event.target.closest(".hamster")) return;
      running = true;
      wheel.classList.add("boosted");
      energy = Math.max(0, energy - 5);
      updateEnergy();
      playTapSound();
      message.textContent = "Dango is running fast!";
      scheduleSeed();
      if (event.pointerId !== undefined && playArea.setPointerCapture) {
        playArea.setPointerCapture(event.pointerId);
      }
    }

    function stopRunning() {
      if (!running) return;
      running = false;
      wheel.classList.remove("boosted");
      if (energy > 0 && gameStarted) message.textContent = "Dango is jogging steadily and slowly recovering energy.";
    }

    function winGame() {
      gameWon = true;
      gameStarted = false;
      running = false;
      wheel.classList.remove("running", "boosted");
      stopButton.hidden = true;
      clearSeeds();
      document.querySelector(".game-card").hidden = true;
      document.getElementById("victory-card").hidden = false;
    }

    function animate(now) {
      const delta = Math.min((now - lastFrame) / 1000, 0.05);
      lastFrame = now;

      if (gameStarted && running && energy > 0) {
        energy = Math.max(0, energy - delta * 24);
        if (energy === 0) {
          running = false;
          wheel.classList.remove("boosted");
          message.textContent = "Out of energy! Dango is jogging slowly to recover.";
        }
      } else if (gameStarted && !running) {
        energy = Math.min(100, energy + delta * 1.5);
      }

      if (gameStarted) {
        const previousAngle = angle;
        const speed = running ? 220 : 90;
        angle = (angle + delta * speed) % 360;
        if (angle < previousAngle) {
          laps += 1;
          lapsDisplay.textContent = String(laps);
          addScore(1);
          if (laps >= 10) {
            winGame();
          }
        }
        wheelTurn.style.transform = `rotate(${angle}deg)`;
      }

      updateEnergy();
      window.requestAnimationFrame(animate);
    }

    startButton.addEventListener("click", startGame);
    stopButton.addEventListener("click", stopGame);
    restartButton.addEventListener("click", restartGame);
    playArea.addEventListener("pointerdown", beginRunning);
    window.addEventListener("pointerup", stopRunning);
    window.addEventListener("pointercancel", stopRunning);
    window.addEventListener("blur", stopRunning);
    window.requestAnimationFrame(animate);
  </script>
</body>
</html>
