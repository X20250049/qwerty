<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b8b4c8">
  <title>Champion · My Hamster</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <style>
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 2rem;
      box-sizing: border-box;
      place-items: center;
      background-color: #b8b4c8;
      color: #332d2a;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 42rem);
      margin: 2rem auto;
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      background-color: #a9bfcb;
      text-align: center;
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(2rem, 8vw, 3rem);
    }

    a {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      color: #332d2a;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      background-color: #d8d8d8;
    }
  </style>
</head>
<body>
  <main>
    <h1>You are the champion!</h1>
    <a href="index.html">← Back to Home</a>
  </main>
</body>
</html>
