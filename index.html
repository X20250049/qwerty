<head>

  <link rel="icon" href="favicon.ico" sizes="any">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 2.5rem;
      box-sizing: border-box;
      background-color: #b8b4c8;
      color: #332d2a;
      font-family: Arial, sans-serif;
      font-size: 18px;
    }

    main {
      max-width: 52rem;
      margin: 2.5rem auto;
      padding: 2rem 2.5rem;

      background-color: #a9bfcb;
      box-shadow: 0 0.4rem 1rem rgba(0, 0, 0, 0.08);

    }

    h2 {
      font-size: 1.9rem;
    }

    nav {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.9rem;
    }

    a {
      display: flex;
      align-items: center;
      gap: 0.95rem;
      padding: 0.8rem 1.1rem;
      color: #332d2a;
      text-decoration: none;
      font-size: 1.35rem;
      font-weight: 600;
    }

    a img {
      width: 5.2rem;
      height: 5.2rem;
      object-fit: cover;
      border-radius: 0.8rem;
    }

    a:hover,
