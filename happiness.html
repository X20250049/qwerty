<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#b8b4c8">
  <title>HAPPINESS · Hamster Care</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <style>
    :root {
      color-scheme: light;
      --page: #b8b4c8;
      --panel: #a9bfcb;
      --highlight: #d8d8d8;
      --ink: #332d2a;
      --muted: #5b5658;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1.25rem;
      place-items: center;
      background: var(--page);
      color: var(--ink);
      font-family: Arial, sans-serif;
    }

    main {
      width: min(100%, 58rem);
    }

    .success-card {
      display: grid;
      min-height: 22rem;
      align-content: center;
      justify-items: center;
      gap: 1rem;
      padding: 2rem;
      border-radius: 1.25rem;
      background: var(--panel);
      box-shadow: 0 0.5rem 1.5rem rgba(51, 45, 42, 0.08);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 10vw, 4.5rem);
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      min-height: 2.8rem;
      padding: 0.65rem 1.1rem;
      border-radius: 999px;
      background: var(--highlight);
      color: var(--ink);
      text-decoration: none;
    }

    .back-link:hover,
    .back-link:focus-visible {
      filter: brightness(1.04);
      outline: 3px solid var(--ink);
      outline-offset: 3px;
    }

    @media (max-width: 42rem) {
      body {
        padding: 1.25rem 1rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="success-card" aria-labelledby="success-title">
      <h1 id="success-title">HAPPINESS</h1>
      <p>Dango is happy and well cared for!</p>
      <a class="back-link" href="index.html">← Back to Home</a>
    </section>
  </main>
</body>
</html>
